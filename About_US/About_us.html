            title="Chiama"
            aria-label="Chiama"
            onclick="contactell()"
          >

            type="button"
            title="Scrivi su WhatsApp"
            aria-label="Scrivi su WhatsApp"
            onclick="openWhatsAppChat()"
          >
            <img class="Immagineicona" src="/img/Icons/Whatsapp.png" alt="" />
