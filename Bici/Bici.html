    <meta charset="utf-8" />

    <title>Giri in Bici | Le nostre bici</title>

    <link rel="icon" href="/img/Icons/bici.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script src="../js/core/formattazione-numeri.js"></script>

    <script src="../js/Bici/visualizzazione/schede.js" defer></script>
    <script src="../js/Bici/visualizzazione/vista.js" defer></script>
    <script src="../js/Bici/nucleo/filtri.js" defer></script>
    <script src="../js/Bici/nucleo/controller.js" defer></script>

  <body class="con-hamburger">
    <gib-barra
      stagioni
      menu="bici"
      menu-etichetta="Apri le categorie"
    ></gib-barra>

    <main class="wrap stack">
      <section class="hero">
        <p class="eyebrow">Il garage</p>
        <h1 class="Titolo">Le nostre bici</h1>
        <p class="hero-sub">
          Filtra per categoria qui sotto, oppure apri il menu in alto a destra.
        </p>
      </section>

      <section class="section">
        <p class="eyebrow">Catalogo</p>
        <h2>Scheda tecnica di ogni bici</h2>
        <nav class="bici-filtri" aria-label="Filtra per categoria">
          <button class="bici-filtro attivo" type="button" data-filtro="home">
            <span class="ico-tile" data-icona="santuario"></span>
            <span>Madonnina in Bici</span>
          </button>
          <button class="bici-filtro" type="button" data-filtro="tutte">
            <span class="ico-tile" data-icona="tutte"></span>
            <span>Tutte</span>
          </button>
          <button class="bici-filtro" type="button" data-filtro="mtb">
            <span class="ico-tile" data-icona="montagna"></span>
            <span>Mountain bike</span>
          </button>
          <button class="bici-filtro" type="button" data-filtro="corsa">
            <span class="ico-tile" data-icona="velocita"></span>
            <span>Bici da corsa</span>
          </button>
        </nav>
        <div id="StampaBici"></div>
      </section>
    </main>

    <gib-piede></gib-piede>

    <!-- Menu laterale con X fissa -->
    <nav class="menu" aria-label="Categorie di biciclette">
      <div class="menu-header">
        <button
          class="menu-close"
          type="button"
          aria-label="Chiudi le categorie"
        >
          <span data-icona="chiudi"></span>
        </button>
      </div>
      <div class="menu-content">
        <h1>Categorie</h1>
        <ul>
          <li>
            <button class="bicimenu" type="button" onclick="CalcolaTutte()">
              <span class="ico-tile" data-icona="tutte"></span>
              <span>Tutte le bici</span>
            </button>
          </li>
          <li>
            <button class="bicimenu" type="button" onclick="CalcolaMTB()">
              <span class="ico-tile" data-icona="montagna"></span>
              <span>Mountain bike</span>
            </button>
          </li>
          <li>
            <button class="bicimenu" type="button" onclick="CalcolaCorsa()">
              <span class="ico-tile" data-icona="velocita"></span>
              <span>Bici da corsa</span>
            </button>
          </li>
          <li>
            <button class="bicimenu" type="button" onclick="Home()">
              <span class="ico-tile" data-icona="santuario"></span>
              <span>Madonnina in Bici</span>
            </button>
          </li>
        </ul>
      </div>
    </nav>
  </body>
</html>
